site_name: Dud Shemesh
site_description: Smart solar water heater (dud shemesh) controller for Home Assistant
site_url: https://bareli.github.io/dud_shemesh/
repo_url: https://github.com/bareli/dud_shemesh
repo_name: bareli/dud_shemesh
edit_uri: edit/main/docs/
copyright: MIT License

hooks:
  - mkdocs_hooks.py

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  logo: assets/icon.png
  favicon: assets/icon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: he
          name: עברית
          build: true
          nav_translations:
            Home: בית
            Install: התקנה
            Configuration: הגדרות
            Features: יכולות
            Examples: דוגמאות
            Troubleshooting: פתרון בעיות
            Changelog: יומן שינויים

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: false
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences

nav:
  - Home: index.md
  - Install: install.md
  - Configuration: configuration.md
  - Features: features.md
  - Examples: examples.md
  - Troubleshooting: troubleshooting.md
  - Changelog: changelog.md
